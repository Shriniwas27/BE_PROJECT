[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-ingestion"
version = "1.1.0"
description = "Floor-plan pipeline: ingestion, perception, topology and metric scale resolution."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "ezdxf>=1.1",
    "PyMuPDF>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
detection = ["ultralytics>=8.1"]
learned = ["onnxruntime>=1.17"]
train = ["torch>=2.2", "onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4", "onnx>=1.15", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
implicit_reexport = true
disallow_untyped_calls = false
ignore_missing_imports = true
